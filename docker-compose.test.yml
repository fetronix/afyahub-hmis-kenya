# This stack is only for `npm run test:docker`. It is intentionally separate
# from the deployment Compose project and never mounts a persistent volume.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jalicare_test
      POSTGRES_DB: jalicare_test
      # The bootstrap supplies a new value in the Compose process environment.
      POSTGRES_PASSWORD:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1::5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U jalicare_test -d jalicare_test']
      interval: 2s
      timeout: 5s
      retries: 60
